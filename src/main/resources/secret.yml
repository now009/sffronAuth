auth:
  # OAuth2 Client 등록 정보
  clients:
    - client-id: saffron-client
      client-secret: "saffron-secret"
      redirect-uri: "http://localhost:8080/login/oauth2/code/saffron"
      scopes:
        - openid
        - profile
        - read
        - write

# JWT 설정 (HS256) - secret 은 운영 환경에서 별도 관리
jwt:
  # HS256 최소 32바이트(256bit) 이상
  secret: "saffron-auth-jwt-secret-key-please-change-in-production-2025"
