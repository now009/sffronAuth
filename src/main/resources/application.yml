server:
  port: 8090

spring:
  application:
    name: Saffron-auth
  config:
    import: "secret.yml"

  datasource:
    url: jdbc:p6spy:mariadb://localhost:3306/saffron?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: now009
    password: 2799
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  jpa:
    hibernate:
      ddl-auto: none
      # @Column(name="userId") 등의 camelCase 컬럼명을 그대로 사용 (snake_case 변환 비활성)
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    open-in-view: false
    show-sql: false

# JWT 만료시간(초). secret 은 secret.yml 에서 관리
jwt:
  expiration-seconds: 3600

# 로그 파일 저장 경로 (날짜별 롤링 파일 생성)
# logback-spring.xml 에서 LOG_PATH 변수로 참조됨
logging:
  file:
    path: C:/temp/auth
  level:
    root: INFO
    org.springframework.security: TRACE

# CORS 허용 origin 목록
# 프론트엔드 또는 API 서버의 주소를 추가/수정
cors:
  # 개발 중 전체 허용 (* 사용 시 모든 origin 허용)
  # 운영 전 실제 도메인으로 변경: "http://localhost:8080,http://localhost:8081"
  allowed-origins: "*"

redirect:
  after-login: "http://localhost:8080/portal/main"
